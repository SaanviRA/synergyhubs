version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: group_app_postgres
    restart: always
    environment:
      POSTGRES_DB: group_app_db
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
    ports:
      # Bound to localhost only: Docker-published ports bypass UFW
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
