<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>SynergyHubs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- Three teammates linked to each other and to a shared hub -->
  <g transform="translate(0 2.5)">
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M32 14 L14 45 L50 45 Z" stroke-width="2.5" stroke-opacity="0.4" stroke-linejoin="round"/>
    <path d="M32 34.5 L32 14 M32 34.5 L14 45 M32 34.5 L50 45" stroke-width="3"/>
  </g>
  <g fill="#ffffff">
    <circle cx="32" cy="14" r="5.5"/>
    <circle cx="14" cy="45" r="5.5"/>
    <circle cx="50" cy="45" r="5.5"/>
    <circle cx="32" cy="34.5" r="6.5"/>
  </g>
  <circle cx="32" cy="34.5" r="2.75" fill="#6d28d9"/>
  </g>
</svg>
